name: HI-UEO JavaScript Syntax Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          a=s.index("<script>\n")+len("<script>\n")
          b=s.rindex("</script>")
          Path("/tmp/hi-ueo.js").write_text(s[a:b],encoding="utf-8")
          PY
          node --check /tmp/hi-ueo.js
