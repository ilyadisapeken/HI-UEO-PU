<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta

  <meta
    name="description"
    content="HI-UEO adalah platform AI untuk membantu pekerjaan, bisnis, dan pembuatan konten dengan lebih cepat."
  >

  <title>HI-UEO — AI untuk Semua Kebutuhan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f6f8fb;
      color: #172033;
      line-height: 1.6;
    }

    

      showChatMessage(data.result, "ai");


      input.value = "";


    } catch (error) {

      console.error(
        "HI-UEO error:",
        error
      );


      showChatMessage("Maaf, terjadi kesalahan: " + error.message, "error");


    } finally {

      button.disabled = false;
      button.textContent =
        originalButton;

      input.disabled = false;

      input.focus();

    }

  }


  // ==========================================
  // TOOLS SEMENTARA
  // ==========================================

  function openTool(tool) {
    const prompts = {
      business: "Bantu saya membuat ide untuk bisnis/UMKM.",
      work: "Bantu saya menyelesaikan pekerjaan kantor.",
      creator: "Bantu saya membuat ide konten.",
      other: "Bantu saya dengan kebutuhan saya.",
      product: "Buatkan deskripsi produk yang menarik.",
      caption: "Buatkan caption jualan yang menarik.",
      content: "Berikan 10 ide konten untuk saya.",
      script: "Buatkan script video pendek.",
      rewrite: "Tulis ulang teks saya agar lebih profesional.",
      summary: "Bantu saya meringkas teks."
    };

    const input = document.getElementById("chatInput");
    input.value = prompts[tool] || "Bantu saya dengan kebutuhan saya.";
    input.focus();
  }

</script>
